<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c1420">
<meta name="description" content="Ship Shift: Claude cooks the code. You run the pass, then take your break.">
<title>Ship Shift</title>
<link rel="stylesheet" href="/game.css">
<link rel="stylesheet" href="/world.css">
<link rel="stylesheet" href="/shell.css">
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
</head>
<body class="game" data-view="boot">
<!-- One page, one WebGL canvas, one scene mounted at a time: the park, or one restaurant.
     #stage holds the canvas and what is pinned to it. #floorUi is the restaurant's own UI (game/floorapp.js).
     #shell is everything outside a restaurant: landing, role picker, town overview, park bar, doors, drawer. -->
<div class="stage" id="stage">
  <div class="vignette"></div>
  <div class="labels" id="labels"></div>
  <div class="pops" id="pops"></div>
  <div class="banners" id="banners" aria-live="polite"></div>
  <div id="floorUi"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>
<div id="shell"></div>
<div class="sh-doors" id="doors" aria-hidden="true"><i class="l"></i><i class="r"></i><b id="doorsSign"></b></div>
<noscript><p style="color:#fff6e3;padding:24px;font-family:sans-serif">Ship Shift needs JavaScript.</p></noscript>
<script type="module" src="/game.js"></script>
</body>
</html>
