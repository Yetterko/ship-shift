<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1c1420">
<title>Ship Shift Town: park harness</title>
<link rel="stylesheet" href="/game.css">
<link rel="stylesheet" href="/world.css">
<style>
  /* Only this page: a stand-in for the inside of a kitchen, which the real game draws. */
  .inside { position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(28,20,32,.72); }
  .inside[hidden] { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three.module.js", "three/addons/": "/vendor/addons/" } }</script>
</head>
<body class="game" data-zone="kitchen">
<!-- The park modules on their own, against the live /ws and /api/world: no kitchen, no game.js.
     ?stay=1 stays inside instead of stepping out, ?perf=1 shows the frame counters, ?quality=low is scene.js's own switch. -->
<div class="stage" id="stage">
  <div class="vignette"></div>
  <div class="labels" id="labels"></div>
  <div class="pops" id="pops"></div>
  <div class="banners" id="banners" aria-live="polite"></div>
  <header class="hud">
    <div class="brand">SHIP<span>SHIFT</span></div>
    <div class="pill clock"><small>Lunch service</small><b>4:12</b></div>
    <div class="pill score"><b>0</b><i>×1.0</i></div>
    <div class="meters"><span class="m"><b>0:00</b></span><span class="m"><b>0</b></span></div>
    <button class="rb" type="button" aria-label="Menu" style="margin-left:auto">≡</button>
  </header>
  <div class="inside" id="inside" hidden>
    <div class="title-card small">
      <h2 id="insideName">Inside</h2>
      <p class="tag" id="insideWhat"></p>
      <button class="btn big" id="insideOut" type="button">Step outside</button>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="perf" id="perf" hidden></div>
</div>
<script type="module">
import { $ } from '/game/core.js';
import { THREE, resize, nextFrame, placeLabels, adapt, quality, setLayout } from '/game/scene.js';
import * as net from '/game/net.js';
import * as park from '/game/park.js';
import * as input from '/game/parkinput.js';
import * as board from '/game/townboard.js';
import * as presence from '/game/presence.js';

const params = new URLSearchParams(location.search);
let built = false, wentOut = false;

function zone(m) {
  const inPark = m.zone === 'park';
  document.body.dataset.zone = inPark ? 'park' : 'kitchen';
  input.setParkActive(inPark);
  if (inPark) park.placeMe(m.x, m.z);
  const pl = inPark ? null : net.plotOf(Number(m.zone.slice(2)));
  $('inside').hidden = inPark;
  if (pl) {
    const rel = net.relationTo(pl);
    $('insideName').textContent = rel === 'owner' ? 'Your kitchen' : `Visiting ${pl.name}`;
    $('insideWhat').textContent = rel === 'owner' ? 'Customers at your door walk in while you are here.' : `You are a ${rel === 'team' ? 'teammate' : 'visitor from another team'}. The real game draws the kitchen here.`;
  }
}
net.onZone(zone);
net.onWorld(w => {
  if (!built) {
    built = true;
    park.buildPark(w);
    input.initParkInput({ standalone: true, onBoard: board.openTownBoard });
    board.initTownBoard({});
    zone({ zone: w.you.zone, x: null, z: null });
  }
  park.syncPark(w); board.syncTownUi(w);
  if (!wentOut && !params.has('stay') && w.you.zone !== 'park') { wentOut = true; net.go('park'); }
});
$('insideOut').onclick = () => net.go('park');
net.connectTown({ onClose: () => location.reload() });

const clock = new THREE.Clock();
let frames = 0, since = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (document.hidden) { clock.getDelta(); return; }
  const dt = Math.min(0.1, clock.getDelta()), t = clock.elapsedTime;
  if (!built) return;
  nextFrame();
  input.parkFrame(dt, t);
  park.stepPark(dt, t);
  board.townFrame(t);
  adapt();
  park.updateParkCamera(dt, park.me);
  placeLabels();
  park.renderPark();
  frames++;
  if (params.has('perf') && performance.now() - since > 500) {
    const s = park.parkStats();
    $('perf').hidden = false; $('perf').textContent = `${Math.round(frames * 1000 / (performance.now() - since))} fps · ${s.calls} calls · ${Math.round(s.triangles / 1000)}k tris · ${s.chars} people · ${s.labels} labels`;
    frames = 0; since = performance.now();
  }
}
// labels keep clear of the HUD and the strip, as touch.js arranges for the kitchen
function fit() { const m = innerWidth < 720 && innerHeight > innerWidth ? 'portrait' : innerHeight < 540 ? 'landscape' : 'desk'; setLayout({ side: false, pad: { l: 6, r: 6, t: m === 'desk' ? 102 : m === 'portrait' ? 120 : 80, b: 8 } }); }
addEventListener('resize', fit);
resize(); fit();
requestAnimationFrame(frame);

// What the headless check drives. The real game exposes the same things as __ship.town.
window.__park = {
  get ready() { return built && !!net.town.world; },
  get world() { return net.town.world; }, get zone() { return net.town.zone; },
  net, park, input, board, presence, quality, me: park.me,
  players: park.parkPlayers, cards: park.parkCards, stats: park.parkStats, screenOf: park.screenOf,
  walkTo: (x, z) => input.walkTo(x, z), hot: input.hotTarget, actions: input.actions, press: input.parkPress,
  labels: () => document.querySelectorAll('.lbl:not(.hid)').length,
};
</script>
</body>
</html>
