# Render blueprint: one free Docker web service running Ship Shift's public demo mode.
# Render sets PORT itself and the server listens on it.
services:
  - type: web
    name: ship-shift
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: SHIP_PUBLIC
        value: "1"
      # The town is not finished, so this deploy goes out with it off: private kitchens only.
      - key: SHIP_WORLD
        value: "0"
      # With ANTHROPIC_API_KEY set in the dashboard, Claude Haiku gives the simulated chefs a voice: short lines of text only.
      # The simulated chefs still do all the work. Without a key they use their own words. The key is never put in this file.
      - key: SHIP_PUBLIC_API
        value: "1"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Hard caps on real spend, in dollars: the whole server, one kitchen, one order.
      - key: SHIP_BUDGET_USD
        value: "100"
      - key: SHIP_KITCHEN_BUDGET_USD
        value: "1.50"
      - key: SHIP_ORDER_BUDGET_USD
        value: "0.40"
      # A free instance has 512 MB and a slice of a CPU, so it holds fewer kitchens than a laptop.
      - key: SHIP_MAX_SESSIONS
        value: "10"
      - key: SHIP_IDLE_MIN
        value: "15"
