# Render blueprint (spec 7.10): one always-on Docker web service holding every audience floor in memory.
# Exactly one instance: all state is in memory. Render sets PORT; the health check is /health.
# Secrets (ANTHROPIC_API_KEY, ADMIN_SECRET) are set in the dashboard, never here. SHOWCASE stays unset on Render.
services:
  - type: web
    name: ship-shift
    runtime: docker
    plan: starter            # paid and always on: a free instance sleeps, and a cold start in front of judges looks broken
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: MAX_LIVE_FLOORS
        value: "60"
      - key: JUDGE_SLOTS
        value: "6"
      - key: MAX_FLOORS
        value: "200"
      - key: MAX_INFLIGHT_CALLS
        value: "20"
      - key: PLAYER_CAP_USD
        value: "0.10"
      - key: JUDGE_CAP_USD
        value: "1.00"
      - key: JUDGE_POOL_USD
        value: "15"
      # The key balance at feature freeze minus a $20 reserve (spec 7.5); set it from /admin/usage before the demo.
      - key: GLOBAL_STOP_USD
        value: "100"
      - key: DEFAULT_MODE
        value: live
      # Demo day: Live floors use the short timings, so the room sees a call-back inside the 2-minute play (open question 2).
      - key: LIVE_TIMINGS
        value: short
      - key: SHIP_NO_QR
        value: "1"
