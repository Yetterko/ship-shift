# Fly.io: Ship Shift's public demo mode. `fly launch --copy-config --ha=false` asks for the app name and region.
# Kitchens live in one machine's memory and disk, so run exactly one machine.
app = "ship-shift"
primary_region = "syd"   # closest to Brisbane

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SHIP_PUBLIC = "1"
  SHIP_MAX_SESSIONS = "25"
  SHIP_IDLE_MIN = "20"

[http_service]
  internal_port = 8080
  force_https = true
  # demo day: keep one machine warm so the first judge never waits for a cold start
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
